<div class="app-shell">
  <header class="topbar">
    <div class="wordmark">Registro académico</div>

    <nav class="topbar-nav" aria-label="Secciones">
      <a
        *appHasRole="roles.Profesor"
        routerLink="/profesor"
        routerLinkActive="active"
        >Estudiantes</a>
      <a
        *appHasRole="roles.Estudiante"
        routerLink="/estudiante"
        routerLinkActive="active"
        >Mis materias</a>
    </nav>

    <div class="topbar-session">
      <span class="session-name">{{ auth.username() }}</span>
      <p-button
        type="button"
        label="Salir"
        size="small"
        severity="secondary"
        [text]="true"
        (onClick)="logout()" />
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
