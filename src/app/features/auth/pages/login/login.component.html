<div class="login-page">
  <header class="login-bar">
    <i class="pi pi-book"></i>
    <span>Registro académico</span>
  </header>

  <main class="login-main">
    <p-card styleClass="login-card">
      <h2>Iniciar sesión</h2>
      <p class="lead">Ingresa con tu usuario de profesor o de estudiante.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="username">Usuario</label>
          <span class="control">
            <i class="pi pi-user"></i>
            <input
              pInputText
              id="username"
              formControlName="username"
              autocomplete="username"
              placeholder="Usuario o identificación" />
          </span>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <span class="control">
            <i class="pi pi-lock"></i>
            <input
              pInputText
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Contraseña" />
            <button type="button" class="eye" (click)="togglePassword()" [attr.title]="showPassword() ? 'Ocultar' : 'Mostrar'">
              <i class="pi" [class.pi-eye]="!showPassword()" [class.pi-eye-slash]="showPassword()"></i>
            </button>
          </span>
        </div>

        <p-button
          type="submit"
          label="Ingresar"
          icon="pi pi-sign-in"
          styleClass="w-full"
          [loading]="submitting()"
          [disabled]="form.invalid || submitting()" />
      </form>

      <p class="hint">Profesor de prueba: profesor / Profesor123!</p>
    </p-card>
  </main>
</div>
