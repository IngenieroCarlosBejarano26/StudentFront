<div class="auth-layout">
  <main class="auth-main">
    <div class="auth-card">
      <p class="wordmark">Registro académico</p>
      <h1>Iniciar sesión</h1>
      <p class="lede">Usuario de profesor o número de identificación.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="username">Usuario</label>
          <span class="control">
            <input
              pInputText
              id="username"
              formControlName="username"
              autocomplete="username"
              placeholder="Usuario o identificación" />
          </span>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <span class="control">
            <input
              pInputText
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Contraseña" />
            <button
              type="button"
              class="icon-btn"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="pi" [class.pi-eye]="!showPassword()" [class.pi-eye-slash]="showPassword()"></i>
            </button>
          </span>
        </div>

        <p-button
          type="submit"
          label="Ingresar"
          styleClass="w-full"
          [loading]="submitting()"
          [disabled]="form.invalid || submitting()" />
      </form>

      <p class="hint">Prueba: profesor / Profesor123!</p>
    </div>
  </main>
</div>
